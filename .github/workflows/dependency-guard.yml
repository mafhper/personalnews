name: Dependency Guard

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json

      - name: Install root npm dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      # o registro npm ocasionalmente não serve a chave pública de um pacote e
      # `npm audit signatures` falha com EMISSINGSIGNATUREKEY mesmo com a árvore
      # correta (medido: o mesmo commit passa em 3 de 3 tentativas localmente).
      # Retry com cache limpo evita um vermelho que não é da dependência.
      - name: Verify root npm registry signatures
        run: |
          for attempt in 1 2 3; do
            echo "::group::npm audit signatures (attempt $attempt/3)"
            npm cache clean --force >/dev/null 2>&1 || true
            if npm audit signatures; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::npm audit signatures failed after 3 attempts"
          exit 1

      # a superfície publicada é o que importa para os usuários; a dívida da
      # árvore de desenvolvimento não bloqueia, apenas fica reportada abaixo
      - name: Audit root known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Report known dev-tree vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
