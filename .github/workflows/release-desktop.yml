# Desktop installers + GitHub Release are created only when a version tag is pushed
# (e.g. git tag -a v1.1.3 -m "Release v1.1.3" && git push origin v1.1.3).
# Pushes to main update GitHub Pages but do not create a new Release.
name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (e.g. v1.19.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20

      - name: install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: resolve release version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$INPUT_TAG"
          version="${tag#v}"

          if [[ "$tag" != v* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            echo "Expected format: vX.Y.Z or vX.Y.Z[-prerelease][+build]"
            exit 1
          fi

          core_version="${version%%[-+]*}"

          node scripts/release-version.mjs
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$package_version" != "$core_version" ]]; then
            echo "package.json version ($package_version) does not match tag core version ($core_version)"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: prepare backend
        run: node scripts/prepare-backend.mjs

      - name: Validate installer assets
        if: runner.os == 'Windows'
        run: bun run desktop:installer-assets:check

      - id: release-image
        name: determine release image
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          image_path="docs/images/releases/release.webp"
          image_url="https://raw.githubusercontent.com/${REPOSITORY}/${TAG}/${image_path}"

          test -f "$image_path"
          test -s "$image_path"
          echo "release.webp exists and is not empty"

          current_core="${VERSION%%[-+]*}"
          current_major_minor="${current_core%.*}"

          prev_tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -Fxv "$TAG" | head -n 1 || true)"

          if [[ -z "$prev_tag" ]]; then
            echo "No previous release tag found; accepting current release image"
          else
            prev_core="${prev_tag#v}"
            prev_core="${prev_core%%[-+]*}"
            prev_major_minor="${prev_core%.*}"

            echo "Current release: $TAG ($current_major_minor)"
            echo "Previous release: $prev_tag ($prev_major_minor)"

            if [[ "$current_major_minor" != "$prev_major_minor" ]]; then
              echo "New major.minor line detected: $prev_major_minor -> $current_major_minor"
              if git diff --quiet "$prev_tag".."$TAG" -- "$image_path"; then
                echo "::error::release.webp was not updated for the new major.minor line. Replace docs/images/releases/release.webp before releasing."
                exit 1
              fi
              echo "release.webp was updated for the new line"
            else
              echo "Same major.minor line; reusing the image (patch release)"
            fi
          fi

          echo "image_url=$image_url" >> "$GITHUB_OUTPUT"

      - id: release-body
        name: build release body from per-version notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_URL: ${{ steps.release-image.outputs.image_url }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${TAG}.md"
          body_file="$RUNNER_TEMP/release-body.md"
          {
            printf '%s\n' '<p align="center">'
            printf '%s\n' "  <img src=\"${IMAGE_URL}\" alt=\"Feed do PersonalNews com navegação por categorias\" width=\"960\">"
            printf '%s\n' '</p>'
            printf '%s\n' ''
            printf '%s\n' 'PersonalNews reúne seus feeds, podcasts e vídeos em uma experiência de leitura local e personalizável.'
            if [ -f "$notes_file" ]; then
              printf '%s\n' ''
              printf '%s\n' '## O que tem de novo nesta versão'
              cat "$notes_file"
            fi
            printf '%s\n' ''
            printf '%s\n' '## Instalação'
            printf '%s\n' ''
            printf '%s\n' '| Sistema | Arquivo recomendado | Uso |'
            printf '%s\n' '| --- | --- | --- |'
            printf '%s\n' '| Windows | `PersonalNews_*_x64-setup.exe` | Instalação comum, sem exigir privilégios de administrador |'
            printf '%s\n' '| Windows | `PersonalNews_*_x64_pt-BR.msi` | Ambientes gerenciados em português |'
            printf '%s\n' '| Linux | `PersonalNews_*_amd64.deb` | Ubuntu, Debian e derivados |'
            printf '%s\n' '| macOS | `PersonalNews_*_aarch64.dmg` | Macs com Apple Silicon |'
            printf '%s\n' ''
            printf '%s\n' '<details>'
            printf '%s\n' '<summary>Outros detalhes de instalação</summary>'
            printf '%s\n' ''
            printf '%s\n' '- O instalador EXE é a opção recomendada para a maioria das pessoas no Windows.'
            printf '%s\n' '- O MSI em inglês também está disponível entre os arquivos da versão.'
            printf '%s\n' '- No macOS, arraste o PersonalNews para a pasta Aplicativos.'
            printf '%s\n' ''
            printf '%s\n' '</details>'
            printf '%s\n' ''
            printf '%s\n' '---'
          } > "$body_file"
          {
            echo "body<<RELEASE_BODY_EOF"
            cat "$body_file"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
          generated=""
          for attempt in 1 2 3; do
            if generated="$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="main" --jq '.body' 2> "$RUNNER_TEMP/generate-notes.err")"; then
              break
            fi
            echo "::warning::generate-notes attempt $attempt failed: $(cat "$RUNNER_TEMP/generate-notes.err" | head -n 1)"
            sleep 3
          done
          if [ -n "$generated" ]; then
            {
              printf '%s\n' ''
              printf '%s\n' '<details>'
              printf '%s\n' '<summary>Lista de mudanças (gerada automaticamente)</summary>'
              printf '%s\n' ''
              printf '%s\n' "$generated"
              printf '%s\n' ''
              printf '%s\n' '</details>'
            } >> "$body_file"
          fi

      - id: create-release
        name: resolve or create the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          for i in $(seq 1 24); do
            if id="$(gh release view "$ref" --json id --jq '.id' 2>/dev/null)"; then
              gh release edit "$ref" --title "Personal News $ref" --notes-file "$RUNNER_TEMP/release-body.md" >/dev/null
              echo "release_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release create "$ref" --target main --title "Personal News $ref" --notes-file "$RUNNER_TEMP/release-body.md" >/dev/null 2>&1 || true
            sleep 5
          done
          echo "could not resolve or create release $ref" >&2
          exit 1
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_VERBOSE: 1
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__ # tauri-action will replace this
          releaseName: "Personal News v__VERSION__"
          releaseId: ${{ steps.create-release.outputs.release_id }}
          releaseBody: ${{ steps.release-body.outputs.body }}
          generateReleaseNotes: false

          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          args: "--bundles ${{ matrix.bundles }} --verbose"