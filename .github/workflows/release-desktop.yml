# Desktop installers + GitHub Release are created only when a version tag is pushed
# (e.g. git tag -a v1.1.3 -m "Release v1.1.3" && git push origin v1.1.3).
# Pushes to main update GitHub Pages but do not create a new Release.
name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 20

      - name: install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: prepare backend
        run: node scripts/prepare-backend.mjs

      - name: Validate installer assets
        if: runner.os == 'Windows'
        run: bun run desktop:installer-assets:check

      - id: release-body
        name: build release body from per-version notes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          body_file="$RUNNER_TEMP/release-body.md"
          {
            printf '%s\n' '<p align="center">'
            printf '%s\n' '  <img src="https://raw.githubusercontent.com/mafhper/personalnews/v__VERSION__/public/releases/release-feed-__VERSION__.png" alt="Feed do PersonalNews com navegação por categorias" width="960">'
            printf '%s\n' '</p>'
            printf '%s\n' ''
            printf '%s\n' 'PersonalNews reúne seus feeds, podcasts e vídeos em uma experiência de leitura local e personalizável.'
            if [ -f "$notes_file" ]; then
              printf '%s\n' ''
              printf '%s\n' '## O que tem de novo nesta versão'
              cat "$notes_file"
            fi
            printf '%s\n' ''
            printf '%s\n' '## Instalação'
            printf '%s\n' ''
            printf '%s\n' '| Sistema | Arquivo recomendado | Uso |'
            printf '%s\n' '| --- | --- | --- |'
            printf '%s\n' '| Windows | `PersonalNews_*_x64-setup.exe` | Instalação comum, sem exigir privilégios de administrador |'
            printf '%s\n' '| Windows | `PersonalNews_*_x64_pt-BR.msi` | Ambientes gerenciados em português |'
            printf '%s\n' '| Linux | `PersonalNews_*_amd64.deb` | Ubuntu, Debian e derivados |'
            printf '%s\n' '| macOS | `PersonalNews_*_aarch64.dmg` | Macs com Apple Silicon |'
            printf '%s\n' ''
            printf '%s\n' '<details>'
            printf '%s\n' '<summary>Outros detalhes de instalação</summary>'
            printf '%s\n' ''
            printf '%s\n' '- O instalador EXE é a opção recomendada para a maioria das pessoas no Windows.'
            printf '%s\n' '- O MSI em inglês também está disponível entre os arquivos da versão.'
            printf '%s\n' '- No macOS, arraste o PersonalNews para a pasta Aplicativos.'
            printf '%s\n' ''
            printf '%s\n' '</details>'
            printf '%s\n' ''
            printf '%s\n' '---'
          } > "$body_file"
          generated="$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -f target_commitish="main" --jq '.body' 2>/dev/null || true)"
          if [ -n "$generated" ]; then
            {
              printf '%s\n' ''
              printf '%s\n' '<details>'
              printf '%s\n' '<summary>Lista de mudanças (gerada automaticamente)</summary>'
              printf '%s\n' ''
              printf '%s\n' "$generated"
              printf '%s\n' ''
              printf '%s\n' '</details>'
            } >> "$body_file"
          fi

      - id: create-release
        name: resolve or create the release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ github.ref_name }}"
          for i in $(seq 1 24); do
            if id="$(gh release view "$ref" --json id --jq '.id' 2>/dev/null)"; then
              echo "release_id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release create "$ref" --target main --title "Personal News $ref" --notes-file "$RUNNER_TEMP/release-body.md" >/dev/null 2>&1 || true
            sleep 5
          done
          echo "could not resolve or create release $ref" >&2
          exit 1
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_VERBOSE: 1
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__ # tauri-action will replace this
          releaseName: "Personal News v__VERSION__"
          releaseId: ${{ steps.create-release.outputs.release_id }}

          generateReleaseNotes: false

          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          args: "--bundles ${{ matrix.bundles }} --verbose"
